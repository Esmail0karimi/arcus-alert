plugins {
    id 'com.android.application'
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing CaptureActivity uses ContextCompat at runtime; include AndroidX Core explicitly.
    implementation 'androidx.core:core:1.15.0'
}
android {
    namespace 'com.arcus.alert'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.arcus.alert'
        def firebaseAndroidAppId = System.getenv('FIREBASE_ANDROID_APP_ID') ?: ''
        buildConfigField 'String', 'FIREBASE_ANDROID_APP_ID', '"' + firebaseAndroidAppId + '"'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    dependencies {
        implementation platform('com.google.firebase:firebase-bom:34.0.0')
        implementation 'com.google.firebase:firebase-auth'
        implementation 'com.google.firebase:firebase-firestore'
        implementation 'com.google.firebase:firebase-messaging'
    }
}
