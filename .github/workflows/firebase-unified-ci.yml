name: Firebase unified branch CI
on:
  push:
    branches:
      - feature/firebase-all-clients-sync
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/firebase-unified-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/firebase-unified-ci.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build web and Windows renderer
        working-directory: desktop
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY }}
        run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: gradle assembleDebug
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install function dependencies
        working-directory: functions
        run: npm install
      - name: Check function syntax
        run: node --check functions/index.js
