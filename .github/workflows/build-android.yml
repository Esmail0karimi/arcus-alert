name: Build Arcus Alert Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | sed '/-----BEGIN CERTIFICATE-----/d; /-----END CERTIFICATE-----/d' | base64 --decode > "$RUNNER_TEMP/arcus-alert-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/arcus-alert-release.jks" >> "$GITHUB_ENV"
      - name: Build debug APK
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arcus-alert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: gradle assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: arcus-alert-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as a download (GitHub release "android-latest")
        if: github.ref_name == 'feature/chart-analysis-tools'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/arcus-alert.apk"
          gh release delete android-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create android-latest "$RUNNER_TEMP/arcus-alert.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Arcus Alert Android (latest)" --notes "Signed release APK built from commit $GITHUB_SHA. Install it over the existing app."
      - name: Attach APK to release v1.1.0
        if: github.ref_name == 'feature/chart-analysis-tools'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Arcus Alert v1.1.0: web chart tools (trend lines, text notes, horizontal-line copy/delete/colour, fullscreen, typed timeframe, Ctrl+Z undo), manual Sync to Android, desktop alert notifications; Android shows only the newest alert and Clear history removes old ones. Web: https://esmail0karimi.github.io/arcus-alert/preview/"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Arcus-Alert-1.1.0.apk"
          gh release create v1.1.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Arcus Alert v1.1.0" --notes "$NOTES" || true
          gh release upload v1.1.0 "$RUNNER_TEMP/Arcus-Alert-1.1.0.apk" --clobber --repo "$GITHUB_REPOSITORY"
