name: Build and deploy Arcus Alert Preview

on:
  workflow_dispatch:
  push:
    branches:
      - preview/build-20
    paths:
      - 'desktop/**'
      - '.github/workflows/deploy-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arcus-alert-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production web branch
        uses: actions/checkout@v4
        with:
          ref: feature/web-platform
          path: production

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/build-20
          path: preview-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build unchanged production site
        working-directory: production/desktop
        run: |
          npm install
          npm run build

      - name: Build preview version
        working-directory: preview-src/desktop
        run: |
          npm install
          npm run build

      - name: Assemble site with isolated preview path
        run: |
          mkdir -p site/preview
          cp -a production/desktop/renderer/. site/
          cp -a preview-src/desktop/renderer/. site/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production root plus isolated preview folder
        id: deployment
        uses: actions/deploy-pages@v4
