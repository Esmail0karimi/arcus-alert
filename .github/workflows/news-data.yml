name: News data (server-side fetch)

# Fetches calendars / earnings / filings from sources browsers cannot read (CORS, bot blocks)
# and publishes one JSON file on the `news-data` branch. The web app reads it from raw.githubusercontent.com.
on:
  push:
    branches: [experiment/qfex]
    paths: [scripts/news-probe.mjs, scripts/publish.sh, scripts/news-data.mjs, .github/workflows/news-data.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: probe or build
        default: build
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/qfex
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe sources
        if: ${{ github.event.inputs.mode == 'probe' || github.event_name == 'push' }}
        run: |
          mkdir -p out
          node scripts/news-probe.mjs | tee out/probe.txt
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} scripts/publish.sh out
