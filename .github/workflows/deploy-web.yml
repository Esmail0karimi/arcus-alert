name: Build and deploy Arcus Alert Web
on:
  workflow_dispatch:
  push:
    branches:
      - feature/web-platform
      - feature/web-alert-persistence-2000-candles
    paths:
      - 'desktop/**'
      - '.github/workflows/deploy-web.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build web app
        working-directory: desktop
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/renderer
  deploy:
    if: github.ref == 'refs/heads/feature/web-platform'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
