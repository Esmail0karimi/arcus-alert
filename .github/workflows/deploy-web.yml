name: Build Arcus Alert Web Preview
on:
  workflow_dispatch:
  push:
    branches:
      - feature/firebase-sync-full-web
    paths:
      - 'desktop/**'
      - '.github/workflows/deploy-web.yml'
permissions:
  contents: read
concurrency:
  group: arcus-web-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build full web app
        working-directory: desktop
        run: npm run build
      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: Arcus-Alert-Web-Preview
          path: desktop/renderer/
          if-no-files-found: error
          retention-days: 14
